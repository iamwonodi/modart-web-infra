name: Tests

# Everything that can be proven without AWS: the shell scripts, the pure Terraform
# module, formatting, and that the environment folder still validates against the
# real provider and modules.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  scripts:
    name: Scripts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck -S warning scripts/*.sh scripts/ci/*.sh

      - name: Script Tests
        run: bash scripts/ci/tests/run-all.sh

      # locals only in locals.tf, data only in data.tf, and every workflow on a
      # pinned runner image.
      - name: File Layout
        run: bash scripts/ci/check-file-layout.sh .

  terraform:
    name: Terraform
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Read Terraform Version
        run: echo "TF_VERSION=$(tr -d '[:space:]' < .terraform-version)" >> "${GITHUB_ENV}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format Check
        run: terraform fmt -check -recursive

      # Every environment folder must commit its provider lock file, locking every
      # provider it declares. Plan and apply then run init -lockfile=readonly,
      # which also covers providers that only modules declare.
      - name: Provider Lock Files
        run: bash scripts/ci/check-lock-files.sh infrastructure/*/

      - name: Service Model Tests
        working-directory: modules/service-model
        run: |
          terraform init -backend=false
          terraform test

      # Validates against the real provider and the real modules. No backend and no
      # credentials are needed; nothing is planned.
      - name: Validate Development
        working-directory: infrastructure/development
        run: |
          terraform init -backend=false
          terraform validate
